<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silão Burro</title>
<meta property="og:title" content="SILÃO BURRO">
<meta property="og:description" content="Homenagem oficial ao Silão 🫏">
<meta property="og:image" content="https://joaolon-dev.github.io/silao-burro/silao.jpg">
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: repeating-linear-gradient(45deg, #ffeb3b 0 40px, #ff9800 40px 80px);
    font-family: Impact, "Arial Black", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; overflow-x: hidden; text-align: center;
  }
  h1 {
    font-size: clamp(3rem, 14vw, 9rem);
    color: #fff;
    -webkit-text-stroke: 3px #000;
    text-shadow: 6px 6px 0 #e91e63;
    line-height: 1;
    animation: treme 0.4s infinite alternate;
  }
  @keyframes treme { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.05); } }
  .foto {
    margin: 28px 0;
    width: min(420px, 90vw);
    border: 10px solid #000;
    border-radius: 12px;
    box-shadow: 12px 12px 0 #e91e63;
    animation: gira 3s ease-in-out infinite;
    background: #fff;
  }
  @keyframes gira { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .sub {
    font-size: clamp(1.2rem, 5vw, 2rem);
    background: #000; color: #ffeb3b;
    padding: 10px 18px; border-radius: 8px;
  }
  .burro { position: fixed; font-size: 3rem; pointer-events: none; animation: cai linear forwards; }
  @keyframes cai { to { transform: translateY(110vh) rotate(720deg); } }
  button {
    margin-top: 24px; font-family: inherit; font-size: 1.4rem;
    padding: 12px 24px; border: 4px solid #000; border-radius: 10px;
    background: #e91e63; color: #fff; cursor: pointer; box-shadow: 5px 5px 0 #000;
  }
  button:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #000; }
</style>
</head>
<body>
  <h1>SILÃO<br>BURRO</h1>
  <img class="foto" src="silao.jpg" alt="Silão">
  <p class="sub">🫏 Patrimônio da burrice nacional 🫏</p>
  <button onclick="chuva(40)">Homenagear o Silão</button>
<script>
  function chuva(n) {
    for (let i = 0; i < n; i++) {
      const e = document.createElement('div');
      e.className = 'burro';
      e.textContent = Math.random() < 0.5 ? '🫏' : '🧠❌';
      e.style.left = Math.random() * 100 + 'vw';
      e.style.top = '-60px';
      e.style.animationDuration = 2 + Math.random() * 3 + 's';
      e.style.animationDelay = Math.random() * 1.5 + 's';
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 7000);
    }
  }
  chuva(15);
</script>
</body>
</html>
